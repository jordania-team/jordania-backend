services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocuser -d pocdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pocdb
      SPRING_DATASOURCE_USERNAME: pocuser
      SPRING_DATASOURCE_PASSWORD: pocpass
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: local-development-secret-change-before-deploy-1234567890
      AUTH_APPLE_CLIENT_ID: rodrigoborges.TarefasPOC
      AUTH_GOOGLE_CLIENT_ID: com.googleusercontent.apps.982679807627-pdaiaiggjgg6p3qqq46oms0vfvmue61h
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
