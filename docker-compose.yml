services:
  postgres:
    image: postgres:18
    container_name: poc-postgres
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocuser -d pocdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/pocapi
    container_name: poc-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pocdb
      SPRING_DATASOURCE_USERNAME: pocuser
      SPRING_DATASOURCE_PASSWORD: pocpass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: